name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The SSH tests run commands through Git Bash, and the window tests need
    # the Windows build of Qt, so this runs on Windows.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -v -o faulthandler_timeout=120
        env:
          QT_QPA_PLATFORM: offscreen
